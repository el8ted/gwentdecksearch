name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # The release workflow runs these same checks before publishing, on the commit being released.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # No `version:` input: pnpm comes from package.json "packageManager" (pnpm 12 needs action-setup >= 6.1).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 runs the .ts scripts directly (native type stripping).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
