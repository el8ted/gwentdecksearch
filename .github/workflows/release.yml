name: Release

# Publishes the live site and a GitHub Release with the offline zip and the deck data as spreadsheets, named after the
# data date.
# - By hand: tag main and push the tag:  git tag 2026-10-16 && git push origin 2026-10-16
# - Automatically: update.yml calls this after committing new data, with the tag it created.
# A second release of the same data adds a two-digit suffix: 2026-10-16.02
on:
  push:
    tags: ['20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # Every tag, so the notes can compare with the previous release's data.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag names the data, so a release can't be labelled with a date its data isn't from.
      - run: |
          scraped=$(node -p "require('./data/decks.json').scrapedAt")
          if [ "${TAG:0:10}" != "${scraped:0:10}" ]; then
            echo "::error::Tag $TAG doesn't match the data date ${scraped:0:10} (UTC). Tag ${scraped:0:10} instead."
            exit 1
          fi
      - run: node scripts/release-notes.ts notes "$TAG" > release-notes.md
      - run: pnpm build
        env:
          RELEASE_TAG: ${{ env.TAG }}
      - name: Zip for offline use
        run: |
          cp -r dist gwent-deck-search
          zip -qr "gwent-deck-search-$TAG.zip" gwent-deck-search
      - name: Zip the deck data
        run: |
          node scripts/export.ts --out gwent-deck-data
          zip -qr "gwent-deck-data-$TAG.zip" gwent-deck-data
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            gwent-deck-search-*.zip
            gwent-deck-data-*.zip
            release-notes.md
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A hand-pushed tag and a scheduled release must not deploy at once: the older data could finish last.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: release
      - run: gh release create "$TAG" gwent-deck-search-*.zip gwent-deck-data-*.zip --title "$TAG" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # File this release's changelog entries under its tag, leaving Unreleased empty for the next changes.
      - name: Update CHANGELOG.md
        run: |
          node scripts/release-notes.ts file "$TAG"
          if git diff --quiet CHANGELOG.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "Changelog: $TAG" CHANGELOG.md
          git push origin main
