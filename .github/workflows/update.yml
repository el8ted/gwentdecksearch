name: Update data

# Refreshes the data on a schedule and, if any deck or card changed, commits it to main and publishes a release.
# - Decks: every Saturday at 05:43 UTC, away from GitHub's midnight-UTC rush.
# - Cards: hourly from 00:07 to 06:07 UTC on the 1st, for the Balance Council changes that go live with the new
#   season; once they're in, the later runs find nothing new and release nothing.
# Times are UTC, past the hour since GitHub delays (or drops) runs at :00, its busiest minute. Runs can still start
# hours late under load. Run it by hand from the Actions tab (Run workflow) to update now.
on:
  schedule:
    - cron: '43 5 * * 6'
    - cron: '7 0-6 1 * *'
  workflow_dispatch:
    inputs:
      what:
        description: What to refresh
        type: choice
        options: [decks, cards, both]
        default: both

# Never two updates at once: both would commit to main.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh
        env:
          WHAT: ${{ inputs.what || (github.event.schedule == '43 5 * * 6' && 'decks' || 'cards') }}
          # Channel videos; without it they're skipped with a warning (see scripts/videos.ts).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "Refreshing: $WHAT"
          if [ "$WHAT" != decks ]; then pnpm scrape:cards; fi
          if [ "$WHAT" != cards ]; then pnpm scrape:decks && pnpm scrape:videos; fi
          pnpm build:data
      # Only a deck or card change is worth a release. Fails (and emails you) if a source lost more than a quarter of
      # its decks, e.g. a sheet made private: the live site keeps its data until someone looks.
      - id: changed
        run: node scripts/release-notes.ts check >> "$GITHUB_OUTPUT"
      - id: publish
        if: steps.changed.outputs.changed == 'true'
        run: |
          date=$(node -p "require('./data/decks.json').scrapedAt.slice(0, 10)")
          # Same-day releases get two-digit suffixes (.02, .03, …) so tags sort in release order.
          tag=$date
          n=2
          while git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do tag=$(printf '%s.%02d' "$date" "$n"); n=$((n + 1)); done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -qm "Data: $tag"
          git tag "$tag"
          git push origin main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.changed != 'true'
        run: echo "::notice::No deck or card changed; nothing to release."

  release:
    needs: update
    if: needs.update.outputs.tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}
    permissions:
      contents: write
      pages: write
      id-token: write
